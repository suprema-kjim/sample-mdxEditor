<!DOCTYPE html>
<html lang="{{lang_code}}">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Noto+Sans:wght@300;400;700&display=swap');

        @page {
            size: A4;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans', 'Noto Sans KR', sans-serif;
            width: 210mm;
            height: 297mm;
            color: #1f2933;
        }

        .cover {
            position: relative;
            width: 210mm;
            height: 297mm;
            overflow: hidden;
            background: #f5f7fa;
        }

        .band {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12mm;
            background: #1d4e89;
        }

        .title {
            position: absolute;
            top: 80mm;
            left: 20mm;
            right: 20mm;
            padding-left: 8mm;
            border-left: 3mm solid #1d4e89;
        }

        .title h1 {
            font-size: 40pt;
            font-weight: 700;
            line-height: 1.15;
        }

        .title h1.small {
            font-size: 30pt;
        }

        .subtitle {
            margin-top: 6mm;
            font-size: 20pt;
            font-weight: 300;
            color: #52606d;
        }

        .meta {
            position: absolute;
            left: 20mm;
            right: 20mm;
            bottom: 20mm;
            padding-top: 5mm;
            border-top: 0.3mm solid #cbd2d9;
            display: flex;
            gap: 10mm;
            font-size: 9pt;
            color: #52606d;
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="band"></div>
        <div class="title">
            <h1{{title_class}}>{{title}}</h1>
            <div class="subtitle">{{subtitle}}</div>
        </div>
        <div class="meta">
            <span>{{version}}</span>
            <span>{{lang}}</span>
            <span>{{docuNum}}</span>
        </div>
    </div>
</body>
</html>
